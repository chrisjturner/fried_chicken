<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14100c">
  <meta name="description" content="A running record of every fried chicken place we've eaten at, scored and mapped.">
  <title>Fried Chicken Index</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍗</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍗</text></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

  <header class="topbar">
    <h1 class="brand"><span aria-hidden="true">🍗</span> Fried Chicken Index</h1>
    <button id="sync-badge" class="sync-badge local" type="button" title="Sync status">local only</button>
  </header>

  <main id="view" class="view"></main>

  <nav id="tabs" class="tabs" aria-label="Main"></nav>

  <div id="sheet" class="sheet" aria-hidden="true" role="dialog" aria-modal="true">
    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div class="sheet-panel">
      <button id="sheet-close" class="sheet-close" type="button" aria-label="Close">✕</button>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/score.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/view-place.js"></script>
  <script src="js/view-map.js"></script>
  <script src="js/view-list.js"></script>
  <script src="js/view-add.js"></script>
  <script src="js/view-settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
