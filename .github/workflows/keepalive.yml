name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write to Supabase (a real write counts as activity) — fail loudly
        run: |
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" --max-time 30 \
            -X PATCH "https://tmiujuhylgkazcskrfpo.supabase.co/rest/v1/keepalive?id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\":\"$now\"}")
          echo "HTTP $code"; cat /tmp/resp.txt
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Keepalive WRITE failed (HTTP $code) — project paused or SUPABASE_ANON_KEY secret wrong."
            exit 1
          fi

      - name: Heartbeat commit (best effort — never fails the job)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-ping.txt
          git add .keepalive/last-ping.txt
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push origin HEAD:main || echo "push skipped (non-fatal)"
